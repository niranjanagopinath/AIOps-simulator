<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>AIOps Monitoring Dashboard</title>
        <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    </head>
    <body style="font-family:sans-serif;text-align:center;">
        <h2>AIOps Metrics Dashboard</h2>
        <canvas id="metricsChart" width="800" height="400"></canvas>
        <script>
            const ctx =document.getElementById('metricsChart').getContext('2d')
            const chart= new Chart(ctx,{
                type:'line',
                data:{
                    labels:[],
                    datasets:[
                    {
                        label: 'CPU Usage (%)',
                        borderColor: 'rgba(255,99,132,1)',
                        fill: false,
                        data: []
                    },
                    {
                        label: 'Memory Usage (%)',
                        borderColor: 'rgba(54,162,235,1)',
                        fill: false,
                        data: []
                    }
                    ]
                },
                options: { scales: { y: { beginAtZero: true } } }

            });
            async  function fetchMetrics(){
                const res=await fetch('/metrics/latest');
                const result=await res.json();
                const data=result.data;
                chart.data.labels=data.map(d=>d[0]);
                chart.data.datasets[0].data=data.map(d=>d[1]);
                chart.data.datasets[1].data=data.map(d=>d[2]);
                chart.update();


            }

            fetchMetrics();
            setInterval(fetchMetrics,2000);

        </script>
    </body>
    </html>
